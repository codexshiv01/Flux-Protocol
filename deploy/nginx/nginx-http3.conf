# Flux HTTP/3 edge (nginx with QUIC build)
# Requires: nginx ≥ 1.25 with http_v3_module, TLS 1.3, ssl_early_data support.
# Origin: Flux runtime on 127.0.0.1:8080

upstream flux_origin {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen 443 quic reuseport;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/ssl/certs/api.example.com.pem;
    ssl_certificate_key /etc/ssl/private/api.example.com.key;
    ssl_protocols       TLSv1.3;
    ssl_early_data      on;

    # Advertise HTTP/3
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Reject non-idempotent early data (replay mitigation)
    set $reject_early 0;
    if ($ssl_early_data = 1) {
        set $reject_early 1;
    }
    if ($request_method = GET) {
        set $reject_early 0;
    }
    if ($reject_early = 1) {
        return 425;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Early-Data $ssl_early_data;
        proxy_set_header Priority $http_priority;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        proxy_pass http://flux_origin;
    }
}
