syntax = "proto3";
package flux.v1;

message GetUserInput {
  string id = 1;
}

message WatchUserInput {
  string id = 1;
}

message HeartbeatInput {
  string clientId = 1;
}

message Post {
  string id = 1;
  string title = 2;
  string body = 3;
}

message User {
  string id = 1;
  string name = 2;
  string email = 3;
  repeated Post posts = 4;
}

service UserService {
  rpc GetUser(GetUserInput) returns (User);
  rpc WatchUser(WatchUserInput) returns (stream User);
  rpc Heartbeat(HeartbeatInput) returns (HeartbeatInput);
}
